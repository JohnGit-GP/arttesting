# ══════════════════════════════════════════════════════════════
# GitLab — Packaging Configuration
# Used by package.sh to pull chart + discover + save images
# ══════════════════════════════════════════════════════════════

# Upstream Helm repo
HELM_REPO_NAME="gitlab"
HELM_REPO_URL="https://charts.gitlab.io"
HELM_CHART_NAME="gitlab"
HELM_CHART_REF="gitlab/gitlab"
HELM_CHART_VERSION="9.11.0"
HELM_RELEASE_NAME="gitlab"

# Upstream image registry
IMAGE_REGISTRY="registry.gitlab.com"

# helm template flags — disable bundled infra, match deployment config
HELM_SET_FLAGS=(
  "--set postgresql.install=false"
  "--set redis.install=false"
  "--set global.minio.enabled=false"
  "--set nginx-ingress.enabled=false"
  "--set certmanager.install=false"
  "--set prometheus.install=false"
  "--set gitlab-runner.install=false"
  "--set global.kas.enabled=true"
  "--set registry.enabled=true"
  "--set global.pages.enabled=false"
  "--set gitlab-zoekt.install=false"
  "--set traefik.install=false"
  "--set haproxy.install=false"
)