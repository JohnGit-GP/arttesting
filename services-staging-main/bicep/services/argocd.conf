# ══════════════════════════════════════════════════════════════
# ArgoCD — Packaging Configuration
# Used by package.sh to pull chart + discover + save images
# ══════════════════════════════════════════════════════════════

# Upstream Helm repo
HELM_REPO_NAME="argo"
HELM_REPO_URL="https://argoproj.github.io/argo-helm"
HELM_CHART_NAME="argo-cd"
HELM_CHART_REF="argo/argo-cd"
HELM_CHART_VERSION="9.5.1"
HELM_RELEASE_NAME="argocd"

# Upstream image registry (empty = use chart defaults)
IMAGE_REGISTRY=""

# helm template flags to match deployment config
HELM_SET_FLAGS=(
  "--set dex.enabled=false"
  "--set notifications.enabled=false"
  "--set redis-ha.enabled=false"
)