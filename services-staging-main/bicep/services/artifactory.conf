# ══════════════════════════════════════════════════════════════
# Artifactory — Packaging Configuration
# Used by package.sh to pull chart + discover + save images
# ══════════════════════════════════════════════════════════════

# Upstream Helm repo
HELM_REPO_NAME="jfrog"
HELM_REPO_URL="https://charts.jfrog.io"
HELM_CHART_NAME="jfrog-platform"
HELM_CHART_REF="jfrog/jfrog-platform"
HELM_CHART_VERSION="10.12.0"
HELM_RELEASE_NAME="artifactory"

# Upstream image registry (empty = use chart defaults)
IMAGE_REGISTRY=""

# helm template flags to match your deployment config
# These control which sub-charts are enabled, which affects which images are discovered
HELM_SET_FLAGS=(
  "--set postgresql.enabled=false"
  "--set pipelines.enabled=false"
  "--set jfconnect.enabled=false"
  "--set nginx.enabled=false"
  "--set xray.enabled=true"
  "--set distribution.enabled=true"
  "--set rabbitmq.enabled=true"
)

# Images that aren't discovered by `helm template` but are still required.
# package.sh appends these to the discovered image list so they end up in
# images.tar and get pushed to Gov ACR by load.sh.
#
#   postgres:16-alpine — used by bicep/charts/jfrog-bootstrap/ Helm hook Job
#                        to create per-product PG users, grants, and extensions
#                        before the main jfrog-platform chart installs.
EXTRA_IMAGES=(
  "postgres:16-alpine"
)